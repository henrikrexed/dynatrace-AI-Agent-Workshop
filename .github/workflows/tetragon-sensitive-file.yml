# ISI-6957 — live validation of the module-03 sensitive-file detection step.
#
# WHY THIS EXISTS
#   ISI-6953 reported the detection step fired no event on a live cluster. No
#   agent can run a kind cluster in its own sandbox (no Docker), but a
#   GitHub-hosted ubuntu-latest runner ships Docker + BTF and runs `kind`
#   privileged — exactly the ISI-6864 pattern. So the "verify on a live kind
#   cluster" deliverable is agent-executable here, on CI, and the raw
#   `getevents` evidence is captured as a job log + artifact.
#
# WHAT IT EXERCISES
#   cluster/tetragon/validate-live.sh — installs Tetragon (same chart version +
#   values.yaml the workshop uses), applies sensitive-file-access.yaml, launches
#   the loop-snoop pod, captures filtered `tetra getevents`, and ASSERTS a
#   `process_kprobe` event for `security_file_permission` names the snoop pod and
#   a sensitive path. The script's exit code is the job's exit code.
#
# HOW TO RUN
#   - push a `ci/tetragon-validation/**` branch (the push is the trigger; no
#     actions:write PAT scope needed), OR
#   - workflow_dispatch from the Actions tab once this file is on the default
#     branch.

name: tetragon-sensitive-file (ISI-6957)

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/tetragon-validation/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner facts (kernel + BTF — Tetragon needs both)
        run: |
          uname -a
          ls -l /sys/kernel/btf/vmlinux || echo "::warning::no BTF on runner kernel"
          docker version --format '{{.Server.Version}}' 2>/dev/null || docker --version

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: tetragon-validation

      - name: Tooling versions
        run: |
          kubectl version --client
          helm version --short
          kubectl get nodes -o wide

      - name: Run live validation (asserts the detection fires)
        id: validate
        run: |
          # bash -e step shell + pipefail so a non-zero script exit (no event
          # captured) fails the job and is never masked by tee.
          set -o pipefail
          bash cluster/tetragon/validate-live.sh 2>&1 | tee tetragon-validate.log

      - name: Cluster snapshot (on failure, for triage)
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n tetragon logs ds/tetragon -c tetragon --tail=100 || true

      - name: Upload raw evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetragon-sensitive-file-evidence
          path: tetragon-validate.log
          if-no-files-found: warn
          retention-days: 30
