name: Publish docs (GitHub Pages)

# Builds the MkDocs Material site and publishes it to the gh-pages branch.
# End users FORK this repo, so this Action runs on their fork and publishes
# their own Pages copy — no secrets required (ISI-6886).

on:
  push:
    branches: [main]
    # Only rebuild when docs or their toolchain/config change.
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch: {}

# gh-deploy force-pushes to gh-pages; needs write access to repo contents.
permissions:
  contents: write

# Never let two publishes race the gh-pages branch.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gh-deploy reads git history to preserve the gh-pages branch.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      # Fail the build on broken links / nav / config before publishing.
      - name: Build (strict)
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force
