name: Build Dynatrace MCP image

# Builds the purpose-built Dynatrace MCP tool-server image (ISI-6938) and pushes
# it multi-arch to ghcr.io/henrikrexed/dynatrace-mcp-server. The image bakes the
# pinned @dynatrace-oss/dynatrace-mcp-server package so the kagent stdio server
# starts instantly (no runtime `npx -y` fetch that blew the MCP initialize
# timeout). The version is read from cluster/versions.env so one bump rolls both
# the manifest reference and the published image.

on:
  push:
    branches: [main]
    paths:
      - images/dynatrace-mcp-server/**
      - cluster/versions.env
      - .github/workflows/build-dynatrace-mcp-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: henrikrexed/dynatrace-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive pinned version from versions.env
        id: ver
        run: |
          set -euo pipefail
          # DYNATRACE_MCP_PACKAGE="@dynatrace-oss/dynatrace-mcp-server@2.1.2"
          # shellcheck source=/dev/null
          source cluster/versions.env
          version="${DYNATRACE_MCP_PACKAGE##*@}"   # strip up to the final @ -> 2.1.2
          [ -n "$version" ] || { echo "could not parse version from DYNATRACE_MCP_PACKAGE"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "node_image=${DYNATRACE_MCP_NODE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Dynatrace MCP version: $version (base ${DYNATRACE_MCP_NODE_IMAGE})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=dynatrace-mcp-server
            org.opencontainers.image.description=Dynatrace MCP server pre-installed for kagent (instant stdio startup)

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/dynatrace-mcp-server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE=${{ steps.ver.outputs.node_image }}
            DYNATRACE_MCP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (report-only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report only: upstream base-image CVEs should not block publishing the
          # workshop image. Review findings in the Actions log.
          exit-code: '0'
