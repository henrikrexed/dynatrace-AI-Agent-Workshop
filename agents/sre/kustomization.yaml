# Phase 3 · SRE agent. The Agent name + modelConfig carry ${WORKSHOP_PREFIX}
# (ISI-6986), so do NOT `kubectl apply -k` this directly — render through envsubst:
#   kubectl kustomize agents/sre | envsubst '${WORKSHOP_PREFIX}' | kubectl apply -f -
# agents/install-agents.sh does exactly this. Requires agents/mcp applied first
# (${WORKSHOP_PREFIX}-workshop-llm ModelConfig) and the kagent chart's built-in
# kagent-tool-server (kagent-tools enabled; never prefixed).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent
resources:
  - sre-agent.yaml
