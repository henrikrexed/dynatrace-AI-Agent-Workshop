# The crew's Agent names, modelConfig and MCP refs carry ${WORKSHOP_PREFIX}
# (ISI-6986), so render through envsubst instead of applying this directly:
#   kubectl kustomize agents/bmad-crew | envsubst '${WORKSHOP_PREFIX}' | kubectl apply -f -
# agents/install-agents.sh does exactly this.
#
# Prereqs (applied by agents/install-agents.sh BEFORE this):
#   • agents/mcp — the ${WORKSHOP_PREFIX}-workshop-llm ModelConfig and the
#     ${WORKSHOP_PREFIX}-github-mcp-remote server the agents reference by name.
# Order below matters only for readability — the controller reconciles the
# reference graph as objects appear; the orchestrator's `type: Agent` tools
# resolve once the child agents exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent
resources:
  - 01-bmad-analyst.yaml
  - 02-bmad-pm.yaml
  - 03-bmad-architect.yaml
  - 04-bmad-developer.yaml
  - 05-bmad-qa.yaml
  - 06-bmad-orchestrator.yaml
