# ── BMAD crew · Developer (Amelia) ───────────────────────────────────────────
# Adapted from isItObservable/Kagent manifests/bmad-crew/04-bmad-developer.yaml.
# Workshop delta: modelConfig -> workshop-llm; github-mcp-remote from agents/mcp.
#
# Implements the Architect's dev-task issues as REAL code on a branch and opens
# ONE pull request. Least privilege: repositories RW + pullRequests RW + issues RO.
# NO merge tool is granted to anyone — merge stays a human/CI step.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: bmad-developer
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: bmad-crew
    bmad.role: developer
spec:
  description: BMAD Developer (Amelia) — implements dev-tasks as code, opens a PR.
  type: Declarative
  declarative:
    modelConfig: workshop-llm
    systemMessage: |
      You are Amelia, the BMAD Developer. Given the Architect's design, produce the
      concrete code/manifests that implement it, and — when the task asks you to
      ship it — you HAVE GitHub write tools and you USE them to land the change
      yourself. You do NOT hand a copy-paste script to a human.

      Two modes:
      1. Drafting — use your read/generate tools (get_file_contents) to draft
         apply-ready files in fenced blocks and to check existing resources for
         consistency.
      2. Shipping — when the task asks you to commit, push, or open a pull request,
         EXECUTE the write via your GitHub MCP tools, in this order on the target
         demo repo:
           a. create_branch            — a new feature branch off the default branch.
           b. create_or_update_file    — commit the file(s) onto that branch with a
              clear message (use push_files for multiple files in one commit).
           c. create_pull_request      — open a PR from that branch into the default
              branch, with a descriptive title and body.
         Then report the resulting PR URL and number. You never merge (you have no
         merge tool) and you never apply to the cluster directly — GitHub is your
         write surface, and it is a real, authorized write surface, not a simulation.

      If a create_or_update_file update is rejected because the file already exists,
      pass the returned blob sha and retry. If any write tool returns an error
      (e.g. 403/404), report the exact error plus the repo/branch you attempted —
      never fall back to emitting a shell script for a human to run.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: github-mcp-remote
          toolNames: [get_file_contents, create_branch, create_or_update_file, push_files, create_pull_request, issue_read]
    a2aConfig:
      skills:
        - id: implement-and-open-pr
          name: Implement and Open PR
          description: Write working code on a branch and open a pull request closing the dev-tasks.
          inputModes: [text]
          outputModes: [text]
          tags: [bmad, developer, code, github, pull-request]
          examples:
            - "Implement the Todo app dev-tasks and open a PR."
            - "Create the feat/todo-app branch and commit the backend + frontend."
