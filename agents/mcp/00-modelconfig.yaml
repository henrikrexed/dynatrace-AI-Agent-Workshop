# ── Phase 3 · shared agent LLM (the "brain") ─────────────────────────────────
# Every workshop agent — the SRE agent and the whole BMAD crew — points at THIS
# ModelConfig by name (`modelConfig: workshop-llm`). Defining it once here keeps
# the model/provider choice in a single place.
#
# Default: DeepSeek (ISI-6716 — chosen for the workshop's cost-efficiency theme).
# DeepSeek's API is OpenAI-compatible, so we use kagent's OpenAI provider with the
# baseUrl pointed at DeepSeek. The model MUST support function/tool calling (the
# BMAD crew is multi-hop tool use); deepseek-chat (DeepSeek-V3) does.
#
# The key is read from secret/kagent-deepseek (created by cluster/secrets.sh from
# DEEPSEEK_API_KEY, or LLM_API_KEY as a fallback).
#
# ── Alternatives (swap here + the matching secret in cluster/secrets.sh) ──────
#   OpenAI:    baseUrl: (drop it), model: gpt-4.1-mini,
#              apiKeySecretRef: kagent-openai,  apiKeySecretKey: OPENAI_API_KEY
#   Anthropic: provider: Anthropic, model: <claude id>, swap openAI:{} -> anthropic:{},
#              apiKeySecretRef: kagent-anthropic, apiKeySecretKey: ANTHROPIC_API_KEY
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: workshop-llm
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: workshop-agents
spec:
  provider: OpenAI                  # DeepSeek is OpenAI-API-compatible
  model: deepseek-chat              # keep in sync with WORKSHOP_LLM_MODEL in cluster/versions.env
  apiKeySecretRef: kagent-deepseek
  apiKeySecretKey: DEEPSEEK_API_KEY
  openAI:
    baseUrl: https://api.deepseek.com/v1   # DeepSeek OpenAI-compatible endpoint
