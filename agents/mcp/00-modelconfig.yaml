# ── Phase 3 · shared agent LLM (the "brain") ─────────────────────────────────
# Every workshop agent — the SRE agent and the whole BMAD crew — points at THIS
# ModelConfig by name (`modelConfig: ${WORKSHOP_PREFIX}-workshop-llm`). Defining
# it once here keeps the model/provider choice in a single place.
#
# The name is templated with ${WORKSHOP_PREFIX} (ISI-6986) so every attendee's
# objects are uniquely named on the shared tenant — resolved by envsubst in
# agents/install-agents.sh at apply time; never commit a per-attendee edit.
#
# Default: DeepSeek (ISI-6716 — chosen for the workshop's cost-efficiency theme).
# DeepSeek's API is OpenAI-compatible, so we use kagent's OpenAI provider with the
# baseUrl pointed at DeepSeek. The model MUST support function/tool calling (the
# BMAD crew is multi-hop tool use); deepseek-chat (DeepSeek-V3) does.
#
# The key is read from secret/kagent-deepseek (created by cluster/secrets.sh from
# DEEPSEEK_API_KEY, or LLM_API_KEY as a fallback).
#
# ── Alternatives (swap here + the matching secret in cluster/secrets.sh) ──────
#   OpenAI:    baseUrl: (drop it), model: gpt-4.1-mini,
#              apiKeySecret: kagent-openai,  apiKeySecretKey: OPENAI_API_KEY
#   Anthropic: provider: Anthropic, model: <claude id>, swap openAI:{} -> anthropic:{},
#              apiKeySecret: kagent-anthropic, apiKeySecretKey: ANTHROPIC_API_KEY
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: ${WORKSHOP_PREFIX}-workshop-llm
  namespace: kagent
  labels:
    app.kubernetes.io/part-of: workshop-agents
spec:
  provider: OpenAI                  # DeepSeek is OpenAI-API-compatible
  model: deepseek-chat              # keep in sync with WORKSHOP_LLM_MODEL in cluster/versions.env
  apiKeySecret: kagent-deepseek
  apiKeySecretKey: DEEPSEEK_API_KEY
  openAI:
    # baseUrl is injected at apply time (envsubst) from WORKSHOP_LLM_BASE_URL in
    # cluster/versions.env — the DeepSeek endpoint by default, or the per-attendee
    # LiteLLM-proxy endpoint when a room password dispensed one (ISI-6996). The key
    # (secret/kagent-deepseek) is the minted virtual key in the proxy case.
    baseUrl: ${WORKSHOP_LLM_BASE_URL}
