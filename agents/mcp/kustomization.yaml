# Phase 3 · MCP wiring + shared model config.
#
# IMPORTANT: 10-github-mcp.yaml carries ${...} token/image placeholders, so it
# must be rendered through envsubst before apply. agents/install-agents.sh
# applies the files individually with envsubst — do NOT `kubectl apply -k` this
# directory.
# This kustomization is kept only as a manifest index / for tooling discovery.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kagent
resources:
  - 00-modelconfig.yaml   # workshop-llm — the shared brain every agent references
  - 10-github-mcp.yaml    # GitHub MCP (BMAD crew write surface)
