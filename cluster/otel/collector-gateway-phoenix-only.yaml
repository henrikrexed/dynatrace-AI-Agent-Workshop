# OpenTelemetryCollector — PHOENIX-ONLY gateway variant (no Dynatrace credentials).
#
# Use this manifest when secret/dynatrace-otlp is ABSENT (attendee booted the
# workshop without DT_TENANT_URL/DT_API_TOKEN). cluster/install.sh picks it
# automatically in that case (ISI-6869).
#
# Why a separate file: the full collector-gateway.yaml references
# ${env:DT_OTLP_ENDPOINT} / ${env:DT_API_TOKEN}. With the secret missing those
# env vars are unset, the collector fails config resolution at startup, and the
# pod CrashLoopBackOffs — it does NOT degrade to Phoenix-only on its own.
# This variant simply omits the otlphttp/dynatrace exporter and the DT_* env
# refs, so the collector starts clean and exports to Phoenix (+ debug logs).
#
# Pipeline shape:
#   kagent agents / instrumented workloads
#        │  OTLP (gRPC 4317 / HTTP 4318)
#        ▼
#   otel-gateway-collector ──▶ Phoenix (OTLP gRPC 4317)   [eval/trace UI]
#                       └─▶ debug (collector stdout)      [diagnostics]
#
# The operator reconciles this CR into the SAME Deployment + Service names as
# the full variant (`otel-gateway-collector`), so agent OTLP endpoints are
# unchanged:
#   otel-gateway-collector.opentelemetry-operator-system.svc.cluster.local:4317
#
# KEEP THIS FILE IN SYNC with collector-gateway.yaml: identical receivers,
# processors (incl. the ${WORKSHOP_PREFIX} resource attrs rendered by envsubst
# in install.sh) and RBAC — only the Dynatrace exporter, DT_* env, and pipeline
# exporter lists differ.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: opentelemetry-operator-system
spec:
  mode: deployment
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 512
        timeout: 5s
      k8sattributes:
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
      resource:
        # Per-attendee identity on a shared Dynatrace tenant (ISI-6986). Both values
        # are rendered from ${WORKSHOP_PREFIX} by `envsubst` in cluster/install.sh at
        # apply time — the single point every exported span/metric/log is tagged.
        #   - k8s.cluster.name : per-attendee cluster name in Dynatrace topology.
        #   - workshop.attendee: a dedicated, stable scoping attribute every training
        #     DQL query filters on, so isolation survives regardless of cluster-name
        #     semantics. NEVER rename it without updating the optimization/ DQL assets.
        attributes:
          - key: k8s.cluster.name
            value: ${WORKSHOP_PREFIX}
            action: upsert
          - key: workshop.attendee
            value: ${WORKSHOP_PREFIX}
            action: upsert
      # Normalise LLM span attributes so Dynatrace AI Observability and Phoenix
      # agree on names. Two directions, both additive:
      #   - OpenInference / Traceloop -> OpenTelemetry gen_ai.* (tokens, model,
      #     provider) for the Dynatrace export.
      #   - kagent/ADK gcp.vertex.agent.* -> OpenInference input.value /
      #     output.value so Phoenix shows prompt/response text (ISI-6960).
      # Nothing is deleted — the vertex and gen_ai.* attrs survive side by side.
      #
      # RECOMMENDED for production: use the purpose-built `genainormalizer`
      # processor instead of hand-rolled OTTL. It ships richer, maintained
      # mappings for OpenInference and OpenLLMetry/Traceloop (token counts, model
      # names, request params, finish reasons) targeting GenAI semconv v1.40.0:
      #
      #   genainormalizer:
      #     sources:
      #       - name: openinference
      #       - name: openllmetry      # Traceloop
      #
      # explorer.opentelemetry.io/collector/components/contrib/genainormalizerprocessor
      # Caveat: it is a CONTRIB component (Alpha, traces) and is NOT in the
      # `opentelemetry-collector-k8s` distro this workshop runs (see
      # operator-values.yaml). Adopting it means switching `collectorImage` to the
      # heavier `opentelemetry-collector-contrib` image (or a custom OCB build).
      # We keep the OTTL transform below so the default k8s image works with no
      # extra image weight; swap to `genainormalizer` when you move to contrib.
      # Note: genainormalizer only reads openinference/openllmetry sources, so the
      # kagent/ADK gcp.vertex.agent.* -> OpenInference block below is still
      # required even after adopting it.
      transform/genai-normalize:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set(attributes["gen_ai.usage.input_tokens"], attributes["llm.token_count.prompt"]) where attributes["llm.token_count.prompt"] != nil
              - set(attributes["gen_ai.usage.output_tokens"], attributes["llm.token_count.completion"]) where attributes["llm.token_count.completion"] != nil
              - set(attributes["gen_ai.request.model"], attributes["llm.model_name"]) where attributes["llm.model_name"] != nil
              - set(attributes["gen_ai.system"], attributes["llm.provider"]) where attributes["llm.provider"] != nil
              # --- OpenInference enrichment for Phoenix (ISI-6960) ---------------
              # kagent (0.10.4) runs Google ADK, which records the LLM request and
              # response JSON on the `call_llm` span under gcp.vertex.agent.*.
              # Phoenix's trace UI and evals/phoenix/run_phoenix_eval.py
              # --from-phoenix read the OpenInference keys input.value /
              # output.value (span_mapping.INPUT_KEYS[0] / OUTPUT_KEYS[0]), which
              # neither the vertex attrs nor the gen_ai.* mapping above produce.
              # Copy them across ADDITIVELY — the originals stay intact for the
              # Dynatrace export and the gen_ai.* pipeline. Both values are already
              # JSON strings (ADK json.dumps), so input.value/output.value are
              # plain strings as OpenInference expects.
              - set(attributes["openinference.span.kind"], "LLM") where attributes["gcp.vertex.agent.llm_request"] != nil or attributes["gcp.vertex.agent.llm_response"] != nil or name == "call_llm"
              - set(attributes["input.value"], attributes["gcp.vertex.agent.llm_request"]) where attributes["gcp.vertex.agent.llm_request"] != nil
              - set(attributes["input.mime_type"], "application/json") where attributes["gcp.vertex.agent.llm_request"] != nil
              - set(attributes["output.value"], attributes["gcp.vertex.agent.llm_response"]) where attributes["gcp.vertex.agent.llm_response"] != nil
              - set(attributes["output.mime_type"], "application/json") where attributes["gcp.vertex.agent.llm_response"] != nil
    exporters:
      debug:
        verbosity: basic
      # Phoenix is a terminal OTLP backend (fan-out here, not a relay chain).
      # No otlphttp/dynatrace exporter here by design — see the header comment.
      otlp/phoenix:
        endpoint: phoenix.phoenix.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, transform/genai-normalize, batch]
          exporters: [otlp/phoenix, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, resource, batch]
          exporters: [debug]
---
# RBAC so the k8sattributes processor can enrich signals with pod/namespace
# metadata. The operator names the collector's ServiceAccount
# "<collector-name>-collector" => "otel-gateway-collector".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-gateway-k8sattributes
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-gateway-k8sattributes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-gateway-k8sattributes
subjects:
  - kind: ServiceAccount
    name: otel-gateway-collector
    namespace: opentelemetry-operator-system
