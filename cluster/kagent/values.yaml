# Helm values for kagent (OCI chart oci://ghcr.io/kagent-dev/kagent/helm/kagent).
# Installed by cluster/install.sh into namespace `kagent`, AFTER the kagent-crds
# chart. This is a **clean base**: the controller, UI, kmcp (MCP framework) and
# the bundled database run, but NO default agents and NO default tool servers are
# installed — Phase 3 (agents & MCP wiring) adds the SRE agent, the BMAD
# crew, and the GitHub/Dynatrace/k8s MCP servers on top of this.

# --- Clean base: disable every built-in agent -------------------------------
k8s-agent:            { enabled: false }
kgateway-agent:       { enabled: false }
istio-agent:          { enabled: false }
promql-agent:         { enabled: false }
observability-agent:  { enabled: false }
argo-rollouts-agent:  { enabled: false }
helm-agent:           { enabled: false }
cilium-policy-agent:  { enabled: false }
cilium-manager-agent: { enabled: false }
cilium-debug-agent:   { enabled: false }

# --- Tool servers -----------------------------------------------------------
# kagent-tools is the built-in `kagent-tool-server` RemoteMCPServer — the
# "default Kubernetes tooling" Phase 3 (ISI-6716) wires into the SRE agent:
# the k8s_* tools (get/describe/logs/events/apply/scale/rollout/exec …) plus the
# k8s-networking tool `k8s_check_service_connectivity`. Phase 2 shipped it OFF
# (clean base); Phase 3 turns it ON so `agents/sre` can reference it by name.
kagent-tools: { enabled: true }    # built-in k8s/helm/istio/argo/cilium tools
grafana-mcp:  { enabled: false }   # default Grafana MCP tool server (unused here)

# kmcp (the MCP controller framework) stays ENABLED — it is platform plumbing,
# not an agent/tool, and Phase 3 needs it to register MCP servers.
kmcp: { enabled: true }

# --- Model provider ----------------------------------------------------------
# Phase 3 (ISI-6716) decided DeepSeek for the workshop (cost-efficiency theme).
# DeepSeek's API is OpenAI-compatible, so we use the `openAI` provider with the
# baseUrl pointed at DeepSeek and the deepseek-chat model; the key is read from
# secret/kagent-deepseek (created by secrets.sh from DEEPSEEK_API_KEY or LLM_API_KEY).
# This sets the chart's *default* ModelConfig; the agents themselves reference the
# `workshop-llm` ModelConfig in agents/mcp/00-modelconfig.yaml (same DeepSeek config).
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: deepseek-chat
    apiKeySecretRef: kagent-deepseek
    apiKeySecretKey: DEEPSEEK_API_KEY
    config:
      baseUrl: https://api.deepseek.com/v1

# --- Observability: export kagent traces to the OTel gateway -----------------
# So that once Phase 3 adds agents, their LLM/tool spans flow to Dynatrace +
# Phoenix with zero extra wiring.
otel:
  tracing:
    enabled: true
    exporter:
      otlp:
        endpoint: "otel-gateway-collector.opentelemetry-operator-system.svc.cluster.local:4317"
        protocol: "grpc"
        insecure: true

# --- Footprint trims for the Codespace --------------------------------------
controller:
  replicas: 1
ui:
  replicas: 1
