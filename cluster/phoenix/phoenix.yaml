# Phoenix (Arize) — LLM trace + eval UI for the workshop.
# Applied by cluster/install.sh into namespace `phoenix`.
#
# Phoenix is a TERMINAL OTLP backend: the OTel gateway fans traces out to it
# (see cluster/otel/collector-gateway.yaml). Attendees open the UI on the
# forwarded Codespace port 6006.
#
# Ports: 6006 = UI + OTLP/HTTP ingest, 4317 = OTLP/gRPC ingest.
# The Service is a NodePort: 6006 is pinned to nodePort 30606, which kind maps
# through to the forwarded Codespace port 6006 (see cluster/kind-config.yaml).
# 4317 stays cluster-internal (the OTel gateway reaches it in-cluster).
# Image + layout verified working against Phoenix OTLP ingest.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-data
  namespace: phoenix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  # Empty storageClassName => the kind cluster default (standard / local-path).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: phoenix
  labels: { app: phoenix }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC — never two writers
  selector:
    matchLabels: { app: phoenix }
  template:
    metadata:
      labels: { app: phoenix }
    spec:
      securityContext:
        fsGroup: 1000            # let the non-root image write the PVC
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-20.19.0-nonroot
          imagePullPolicy: IfNotPresent
          env:
            - name: PHOENIX_WORKING_DIR
              value: /mnt/data
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_GRPC_PORT
              value: "4317"
            # --- DeepSeek preconfigured for the playground/evals (ISI-6959) ----
            # Attendees never hand-enter a key: Phoenix reads DEEPSEEK_API_KEY from
            # a secret (resolution order is Browser > DB Secrets > Env, so an env
            # default needs no PHOENIX_SECRET). optional:true keeps Phoenix booting
            # even if no key was provided — the UI just falls back to manual entry.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: phoenix-deepseek
                  key: DEEPSEEK_API_KEY
                  optional: true
            # Restrict the playground model menu to the one approved provider so
            # DeepSeek is the obvious (only) choice. Case-insensitive, CSV.
            - name: PHOENIX_ALLOWED_PROVIDERS
              value: "DEEPSEEK"
            # Base URL injected at apply time (envsubst in cluster/install.sh) from
            # cluster/versions.env:WORKSHOP_LLM_BASE_URL — the workshop source of truth.
            # DeepSeek direct (https://api.deepseek.com/v1) by default, or the
            # per-attendee LiteLLM-proxy endpoint when a room password dispensed one
            # (ISI-6996). The /v1 form matches the dt-evals/judge config; the matching
            # key lands in secret/phoenix-deepseek (the minted virtual key in the proxy case).
            - name: DEEPSEEK_BASE_URL
              value: "${WORKSHOP_LLM_BASE_URL}"
          ports:
            - { name: ui-http, containerPort: 6006 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /healthz, port: 6006 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 6006 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /mnt/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: phoenix-data
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: phoenix
  labels: { app: phoenix }
spec:
  type: NodePort
  selector: { app: phoenix }
  ports:
    - { name: ui-http, port: 6006, targetPort: 6006, nodePort: 30606 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
