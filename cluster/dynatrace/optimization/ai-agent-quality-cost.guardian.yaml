# Site Reliability Guardian — AI Agent Quality & Cost (Phase 5 · ISI-6720)
#
# A continuous regression gate for the kagent crew: it fails when agents get
# more expensive (bigger prompts / chattier loops) or when answer substance
# collapses. This is the "make it continuous" step of docs/06-optimize.md.
#
# Deploy:
#   dtctl create settings -f ai-agent-quality-cost.guardian.yaml \
#     --schema app:dynatrace.site.reliability.guardian:guardians --scope environment
#
# All objective SLIs validated against live crew telemetry before commit.
# The Phase-4 dt-evals suite (module 05) is the complementary LLM-judge quality
# gate; the companion workflow runs both.
name: "Workshop · AI Agent Quality & Cost Guardian (ISI-6720)"
description: >-
  Continuous regression gate for the kagent AI-agent crew: fails on cost
  regressions (prompt bloat, re-sent loop context) or collapsed answer
  substance. Pair with the Phase-4 dt-evals LLM-judge quality gate.
tags:
  - "workshop:ai-agents"
  - "phase:5"
  - "isi:6720"
variables: []
objectives:
  - name: "Cost per LLM call"
    objectiveType: DQL
    description: >-
      Avg input tokens per call_llm across the crew. Rising = prompt bloat,
      unused tool schemas on every call, or re-sent loop context.
    comparisonOperator: LESS_THAN_OR_EQUAL
    target: 20000
    warning: 18000
    dqlQuery: |
      fetch spans, from: now()-1d
      | filter service.namespace == "kagent" and span.name == "call_llm" and isNotNull(gen_ai.usage.input_tokens)
      | summarize sli = round(avg(gen_ai.usage.input_tokens))
      | fields sli
    segments: []
    links: []
  - name: "Loop efficiency"
    objectiveType: DQL
    description: >-
      Avg call_llm hops per agent task. Rising = chatty multi-hop workflows
      re-sending the same growing context.
    comparisonOperator: LESS_THAN_OR_EQUAL
    target: 5
    warning: 4
    dqlQuery: |
      fetch spans, from: now()-1d
      | filter service.namespace == "kagent" and span.name == "call_llm"
      | summarize calls = count(), by:{gen_ai.task.id}
      | summarize sli = round(avg(calls), decimals: 2)
      | fields sli
    segments: []
    links: []
  - name: "Answer substance (quality proxy)"
    objectiveType: DQL
    description: >-
      Avg output tokens per call_llm. A cost cut that collapses this is
      answering worse, not cheaper — revert it. Backstops the dt-evals gate.
    comparisonOperator: GREATER_THAN_OR_EQUAL
    target: 200
    warning: 300
    dqlQuery: |
      fetch spans, from: now()-1d
      | filter service.namespace == "kagent" and span.name == "call_llm" and isNotNull(gen_ai.usage.output_tokens)
      | summarize sli = round(avg(gen_ai.usage.output_tokens))
      | fields sli
    segments: []
    links: []
