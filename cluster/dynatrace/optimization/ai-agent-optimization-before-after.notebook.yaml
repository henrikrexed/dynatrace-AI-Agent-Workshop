name: Workshop · AI Agent Optimization — before/after (ISI-6720)
type: notebook
content:
  defaultSegments: []
  defaultTimeframe:
    from: now()-7d
    to: now()
  sections:
  - id: 84922054-3f91-4f1c-854e-9071c5846864
    type: markdown
    markdown: '# AI Agent Optimization — a measurable before/after


      **ISI-6720 · Phase 5** · Tenant `oat05854.dev.apps.dynatracelabs.com` · data: `gen_ai.*` spans from the kagent crew (`service.namespace == "kagent"`).


      This notebook is the *reproducible story* behind module **`docs/06-optimize.md`**. It follows the optimization loop:


      > **observe → find the waste → make one change → re-measure → keep only if quality held.**


      Run it top-to-bottom. Sections 1–3 find the waste; section 4 is the change; section 5 is the measured before/after; section 6 is the keep/revert rule.'
  - id: c3cdea9d-a2c8-43b0-88d8-a81c23daaac3
    type: markdown
    markdown: '## 1 · Rank agents by spend

      Start at the top of this list — a 20% cut on the priciest agent beats a 50% cut on a rare one.'
  - drilldownPath: []
    filterSegments: []
    id: 87a84b47-5a68-470c-9291-c945c4085284
    previousFilterSegments: []
    showInput: true
    showTitle: true
    state:
      input:
        timeframe:
          from: now()-7d
          to: now()
        value: "fetch spans\n| filter service.namespace == \"kagent\" and isNotNull(gen_ai.usage.output_tokens)\n| summarize llmCalls = count(),\n    inputTokens = sum(gen_ai.usage.input_tokens),\n    outputTokens = sum(gen_ai.usage.output_tokens),\n    by:{agent = service.name}\n| fieldsAdd totalTokens = inputTokens + outputTokens\n| sort totalTokens desc"
    title: Token spend by agent (7d)
    type: dql
  - id: f8a17b82-74c6-4adf-9881-e41672836c75
    type: markdown
    markdown: '## 2 · Spot the waste signature

      A high **input : output ratio** and a large **avg input per call** means the model re-reads a bloated context (big system prompt + unused tool schemas) on every single call. `seta_sre_investigator` is the outlier here.'
  - drilldownPath: []
    filterSegments: []
    id: 63ed07a9-002e-4338-afcc-4c0e103faa08
    previousFilterSegments: []
    showInput: true
    showTitle: true
    state:
      input:
        timeframe:
          from: now()-7d
          to: now()
        value: "fetch spans\n| filter service.namespace == \"kagent\" and isNotNull(gen_ai.usage.output_tokens)\n| summarize llmCalls = count(),\n    inputTokens = sum(gen_ai.usage.input_tokens),\n    outputTokens = sum(gen_ai.usage.output_tokens),\n    by:{agent = service.name}\n| fieldsAdd totalTokens = inputTokens + outputTokens,\n    inOutRatio = round(toDouble(inputTokens) / outputTokens, decimals: 1),\n    avgInputPerCall = round(toDouble(inputTokens) / llmCalls)\n| sort avgInputPerCall desc"
    title: 'Input : output ratio & avg input per call'
    type: dql
  - id: 8b9b2285-2da8-4bd9-a6bd-d5ba86a82e20
    type: markdown
    markdown: '## 3 · Which tools does the agent actually use?

      Every tool granted in the agent''s `toolNames` is described in **every** prompt — billed as input tokens whether it is called or not. List the tools the SRE agent *actually* calls, then compare against its granted set in `agents/sre/sre-agent.yaml`. Anything granted-but-never-called is pure overhead to drop.'
  - drilldownPath: []
    filterSegments: []
    id: 85dd7f75-6b29-434f-a4e7-326fd7b62c62
    previousFilterSegments: []
    showInput: true
    showTitle: true
    state:
      input:
        timeframe:
          from: now()-7d
          to: now()
        value: "fetch spans\n| filter service.namespace == \"kagent\" and service.name == \"seta_sre_investigator\"\n    and gen_ai.operation.name == \"execute_tool\" and gen_ai.tool.name != \"(merged tools)\"\n| summarize calls = count(), by:{tool = gen_ai.tool.name}\n| sort calls desc"
    title: Tools actually called by the SRE investigator (7d)
    type: dql
  - id: 310445da-9dc0-4495-bd4e-0cee95c1da7c
    type: markdown
    markdown: "## 4 · The change — trim the unused tools\nIn `agents/sre/sre-agent.yaml` the Dynatrace MCP server is attached with **no `toolNames` filter**, so *every* discovered Dynatrace tool schema is injected into every prompt, and the k8s tool list grants 15 tools. Section 3 shows the agent only ever calls a handful.\n\nPin `toolNames` to just the tools the traces prove it uses, re-apply (`bash agents/install-agents.sh`), then re-run the **same** prompts so the before/after is apples-to-apples:\n\n```yaml\n- type: McpServer\n  mcpServer:\n    apiGroup: kagent.dev\n    kind: RemoteMCPServer\n    name: dynatrace-mcp-remote\n    toolNames:          # was: unset (every tool) → now: only what the traces show\n      - list_problems\n      - get_logs\n      - execute_dql\n```\n\n> Change **one** thing at a time. If you trim tools *and* shorten the prompt in the same step, you can't attribute the win."
  - id: e17550d8-5359-4f60-b137-492c0e61c351
    type: markdown
    markdown: '## 5 · Re-measure — the before/after

      The metric that moves is **avg input tokens per `call_llm`**. Run this query over your **before** window, apply the change, replay the prompts, then run it again over the **after** window. The `timeframe` picker on this section is how you switch windows.'
  - drilldownPath: []
    filterSegments: []
    id: 75ce79ac-01b7-4a31-b81e-c61c2e1bfef9
    previousFilterSegments: []
    showInput: true
    showTitle: true
    state:
      input:
        timeframe:
          from: now()-7d
          to: now()
        value: "fetch spans\n| filter service.namespace == \"kagent\" and service.name == \"seta_sre_investigator\"\n    and span.name == \"call_llm\" and isNotNull(gen_ai.usage.input_tokens)\n| summarize llmCalls = count(),\n    avgInputPerCall = round(avg(gen_ai.usage.input_tokens)),\n    medianInputPerCall = round(median(gen_ai.usage.input_tokens)),\n    totalInputTokens = sum(gen_ai.usage.input_tokens)"
    title: Avg input tokens per call — SRE investigator (switch the timeframe for before vs after)
    type: dql
  - drilldownPath: []
    filterSegments: []
    id: 28f9dca3-826c-4b09-8952-9909bd493704
    previousFilterSegments: []
    showInput: true
    showTitle: true
    state:
      input:
        timeframe:
          from: now()-7d
          to: now()
        value: 'fetch spans

          | filter service.namespace == "kagent" and isNotNull(gen_ai.usage.input_tokens)

          | makeTimeseries inputTokens = sum(gen_ai.usage.input_tokens), by:{service.name}'
    title: Input-token trend by agent — watch the top line bend down after the change
    type: dql
  - id: 3b569c67-2df8-49eb-b97e-e15a1e54b18e
    type: markdown
    markdown: '## 6 · The rule — keep or revert

      Ship the change only when **cost went down AND the eval pass rate did not** (module 05, `evals/dt-evals`). A cheaper agent that answers wrong is more expensive than the costly one that''s right.


      | Metric | Before | After | Keep? |

      |---|:--:|:--:|:--:|

      | Avg input tokens / call | _(§5)_ | _(§5)_ | — |

      | Eval pass rate | _(module 05)_ | _(module 05)_ | ✅ only if ≥ before |


      Then make it continuous: keep `dt-evals` in CI as a budget + regression gate, and alert when any agent''s tokens-per-task drifts back up (companion dashboard: *Workshop · AI Agent Optimization*).'
