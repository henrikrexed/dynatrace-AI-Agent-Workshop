# Helm values for the Dynatrace Operator (chart dynatrace/dynatrace-operator).
# Installed by cluster/install.sh into namespace `dynatrace`.
#
# We run Dynatrace in **Kubernetes monitoring mode** (ActiveGate-based, NO node
# OneAgent full-stack). The operator + its CRDs are installed by this chart; the
# monitoring itself is configured by the DynaKube custom resource in dynakube.yaml.
#
# Defaults are deliberately minimal — the chart's defaults are correct for a
# single-node Codespace cluster. We only trim resource requests so the operator
# fits comfortably alongside the rest of the Phase 2 stack.

# Install the DynaKube/EdgeConnect CRDs with the chart (default true; explicit here).
installCRD: true

# Keep the operator footprint small for the Codespace.
operator:
  requests:
    cpu: 50m
    memory: 64Mi

webhook:
  requests:
    cpu: 50m
    memory: 64Mi
