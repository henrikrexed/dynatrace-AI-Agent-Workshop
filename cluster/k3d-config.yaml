# k3d cluster config for the Dynatrace AI Agent Workshop (default engine).
# Docs: https://k3d.io/stable/usage/configfile/
#
# Rationale (see .devcontainer/DECISIONS.md): k3d (k3s) has the smallest RAM
# footprint of the local options and ships a built-in load balancer (klipper
# servicelb) + Traefik, so the workshop UIs can be reached without extra wiring.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: workshop
servers: 1
agents: 1
image: docker.io/rancher/k3s:v1.31.4-k3s1
ports:
  # host:container mappings so forwarded Codespace ports reach the cluster LB.
  - port: 8000:80      # ingress HTTP (mkdocs/kagent/phoenix via Traefik)
    nodeFilters:
      - loadbalancer
  - port: 8443:443     # ingress HTTPS
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Disable bundled Traefik only if Phase 2 prefers Gateway API/NGINX; left
      # enabled for a batteries-included default.
      - arg: --disable=metrics-server
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
