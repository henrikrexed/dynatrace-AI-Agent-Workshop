site_name: Dynatrace AI Agent Workshop
site_description: >-
  Hands-on workshop — cost-efficient AI agent workflows with BMAD, kagent,
  Kubernetes, and Dynatrace AI Observability.
site_author: Henrik Rexed
repo_url: https://github.com/henrikrexed/dynatrace-AI-Agent-Workshop
repo_name: henrikrexed/dynatrace-AI-Agent-Workshop
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

# Nav mirrors the plan §2 learning arc end to end:
# Why (Home) → kagent intro → build cluster → platform → deploy agents →
# secure → observe → evaluate → optimize, plus a consolidated troubleshooting ref.
nav:
  - Home: index.md
  - "kagent in 5 minutes": kagent-explainer.md
  - "00 — Setup (Codespace)": 00-setup.md
  - "01 — Platform install": 01-platform-install.md
  - "02 — Agents & MCP wiring": 02-agents-mcp.md
  - "03 — Secure agents": 03-secure.md
  - "04 — Observe with Dynatrace": 04-observe.md
  - "05 — Evaluate (Phoenix + dt-evals)": 05-evaluate.md
  - "06 — Optimize": 06-optimize.md
  - Troubleshooting: troubleshooting.md
